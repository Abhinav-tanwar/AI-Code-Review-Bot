[project]
name = "ai-code-review-bot"
version = "1.0.0"
description = "Evidence-focused GitHub pull request reviews with FastAPI and GPT"
requires-python = ">=3.12"
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
