name: Automated PR review
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pull_number:
        description: Pull request number to review
        required: true
        type: number
      publish:
        description: Publish advisory review to GitHub
        default: false
        type: boolean
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: code-review-${{ github.repository }}-${{ github.event.pull_request.number || inputs.pull_number }}
  cancel-in-progress: false
jobs:
  review:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (vars.AI_REVIEW_ENABLED == 'true' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Only the trusted default-branch implementation is installed and executed.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Review patch without executing PR code
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1
          GITHUB_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pull_number }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          PUBLISH_REVIEW: ${{ github.event_name == 'pull_request' || inputs.publish }}
          ALLOWED_REPOSITORIES: ${{ github.repository }}
        run: |
          python - <<'PYCODE'
          import os, subprocess, sys
          number = int(os.environ['PR_NUMBER'])
          if number < 1:
              raise SystemExit('Invalid pull request number')
          command = [sys.executable, '-m', 'reviewbot.cli', '--repository', os.environ['GH_REPOSITORY'], '--pull-number', str(number)]
          if os.environ.get('EXPECTED_HEAD'):
              command += ['--expected-head', os.environ['EXPECTED_HEAD']]
          if os.environ.get('PUBLISH_REVIEW', '').lower() == 'true':
              command.append('--publish')
          subprocess.run(command, check=True)
          PYCODE
